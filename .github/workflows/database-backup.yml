name: Database Backup

on:
  schedule:
    # Every Sunday at 3 AM UTC
    - cron: "0 3 * * 0"
  workflow_dispatch: # Allow manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Install PostgreSQL 17 client
        # pg_dump must be at least as new as the Supabase server
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump and encrypt database
        env:
          # Use the Supabase *Session pooler* connection string — the direct
          # connection is IPv6-only and GitHub runners can't reach it.
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" || { echo "SUPABASE_DB_URL secret is not set"; exit 1; }
          test -n "$BACKUP_PASSPHRASE" || { echo "BACKUP_PASSPHRASE secret is not set"; exit 1; }
          pg_dump "$DATABASE_URL" \
            --no-owner --no-acl \
            --schema=public --schema=auth \
            | gzip \
            | gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
                --passphrase "$BACKUP_PASSPHRASE" \
                --output "wtmap-backup-$(date -u +%Y%m%d).sql.gz.gpg"
          ls -lh wtmap-backup-*.sql.gz.gpg

      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: wtmap-db-backup
          path: wtmap-backup-*.sql.gz.gpg
          retention-days: 90
          if-no-files-found: error
